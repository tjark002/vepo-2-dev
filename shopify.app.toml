# Vepo Product Configurator

client_id = "e519f8388ddc2ce2e11620810946c9df"
name = "VEPO 2 Dev"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_products,write_products,read_themes,write_themes,read_files,write_files,write_cart_transforms,read_publications,write_publications,read_inventory,write_inventory"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[webhooks]
api_version = "2025-10"

[app_proxy]
url = "https://shopify.dev/vepoapi"
subpath = "vepo"
prefix = "apps"

[pos]
embedded = false
